<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentine's Day 💕</title>
    <style>
      /* ═══════════════════════════════════════
   RESET & COLOR PALETTE
   ═══════════════════════════════════════ */
      *,
      *::after,
      *::before {
        padding: 0;
        margin: 0;
        box-sizing: border-box;
      }

      :root {
        --dark-color: #0a0408;

        /* 💛 HER COLOR (yellow family) */
        --yellow: #ffe566;
        --yellow-deep: #f0c040;

        /* 🤍 YOUR COLOR (white family) */
        --white: #ffffff;
        --white-soft: #fff7e6;

        /* 💕 Valentine accents that complement yellow/white */
        --rose: #c2185b;
        --rose-dusty: #d4567a;
        --wine: #8b1a4a;
        --burgundy: #6b1d3a;
        --pink-pale: #ff9ec3;
        --pink-light: #ffb6c9;
      }

      /* ═══════════════════════════════════════
   PHASE 1 — ASK PAGE (intentionally bare)
   ═══════════════════════════════════════ */
      #ask-page {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        padding: 2rem;
        background: white;
        text-align: center;
      }
      #ask-page.hidden {
        display: none;
      }

      /* Image container - just sizing, no fancy styles */
      .ask-image-wrap {
        width: 200px;
        height: 200px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .ask-image-wrap img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .ask-image-wrap .placeholder-icon {
        font-size: 4rem;
      }

      /* Question text - just basic text */
      .ask-question {
        font-size: 1.5rem;
      }

      /* Button row */
      .btn-row {
        display: flex;
        gap: 1.5rem;
        align-items: center;
        justify-content: center;
        min-height: 100px;
      }

      /* Buttons - bare minimum styling */
      #yes-btn,
      #no-btn {
        border: 1px solid black;
        padding: 8px 16px;
        background: white;
        cursor: pointer;
        font-size: 1rem;
      }

      /* YES button grows with transition */
      #yes-btn {
        transition:
          font-size 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
          padding 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      /* ═══════════════════════════════════════
   PHASE 2 — YES / CELEBRATION PAGE
   ═══════════════════════════════════════ */
      #yes-page {
        position: fixed;
        inset: 0;
        background: var(--dark-color);
        overflow: hidden;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 1s ease,
          visibility 1s ease;
        z-index: 500;
      }
      #yes-page.visible {
        opacity: 1;
        visibility: visible;
      }

      /* ─── NIGHT SKY BACKGROUND ─── */
      .night {
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(
            ellipse at top,
            rgba(255, 240, 215, 0.5),
            var(--white-soft)
          ),
          radial-gradient(
            ellipse at bottom,
            rgba(255, 214, 102, 0.25),
            rgba(194, 24, 91, 0.4)
          ),
          linear-gradient(180deg, var(--white-soft), var(--rose-dusty));
      }

      /* ─── FLOWER SCENE WRAPPER ─── */
      .flower-scene {
        position: absolute;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        height: 100%;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        perspective: 1000px;
      }

      /* ─── PHOTO COLLAGE RING ─── */
      .collage-ring {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 520px;
        height: 520px;
        z-index: 200;
        pointer-events: none;
      }

      .collage-photo {
        position: absolute;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 3px solid var(--yellow-deep);
        overflow: hidden;
        box-shadow:
          0 4px 20px rgba(0, 0, 0, 0.5),
          0 0 14px rgba(194, 24, 91, 0.3);
        background: var(--burgundy);
        opacity: 0;
        animation: photo-fade-in 0.8s ease forwards;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .collage-photo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .collage-photo .ph {
        font-size: 2.2rem;
        opacity: 0.35;
      }

      /* Position each photo around the ring */
      .collage-photo:nth-child(1) {
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        animation-delay: 1.2s;
      }
      .collage-photo:nth-child(2) {
        top: 12%;
        right: -2%;
        animation-delay: 1.5s;
      }
      .collage-photo:nth-child(3) {
        top: 48%;
        right: -8%;
        animation-delay: 1.8s;
      }
      .collage-photo:nth-child(4) {
        bottom: 5%;
        right: 8%;
        animation-delay: 2.1s;
      }
      .collage-photo:nth-child(5) {
        bottom: 5%;
        left: 8%;
        animation-delay: 2.4s;
      }
      .collage-photo:nth-child(6) {
        top: 48%;
        left: -8%;
        animation-delay: 2.7s;
      }
      .collage-photo:nth-child(7) {
        top: 12%;
        left: -2%;
        animation-delay: 3s;
      }

      @keyframes photo-fade-in {
        0% {
          opacity: 0;
          transform: scale(0.4);
        }
        60% {
          opacity: 1;
          transform: scale(1.05);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      /* ─── MESSAGE OVERLAY ─── */
      .yes-message {
        position: absolute;
        top: 8%;
        left: 50%;
        transform: translateX(-50%);
        z-index: 300;
        text-align: center;
        opacity: 0;
        animation: msg-in 1s 2.8s ease forwards;
        padding: 0 1rem;
        width: 90%;
        max-width: 560px;
      }

      @keyframes msg-in {
        0% {
          opacity: 0;
          transform: translateX(-50%) translateY(-20px);
        }
        100% {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }

      .yes-message h1 {
        color: var(--yellow);
        font-size: clamp(2rem, 6vw, 3.4rem);
        text-shadow: 0 0 24px rgba(194, 24, 91, 0.5);
        margin-bottom: 0.5rem;
        line-height: 1.2;
      }

      .yes-message p {
        font-style: italic;
        color: var(--white-soft);
        font-size: clamp(0.95rem, 2.2vw, 1.15rem);
        line-height: 1.6;
      }

      /* ─── FLOATING HEARTS ─── */
      .heart {
        position: absolute;
        font-size: 1.4rem;
        opacity: 0;
        pointer-events: none;
        z-index: 250;
        animation: heart-float 6s linear forwards;
      }

      @keyframes heart-float {
        0% {
          opacity: 0;
          transform: translateY(0) rotate(0deg);
        }
        10% {
          opacity: 0.9;
        }
        80% {
          opacity: 0.6;
        }
        100% {
          opacity: 0;
          transform: translateY(-100vh) rotate(360deg);
        }
      }

      /* ═══════════════════════════════════════
   FLOWERS — Yellow/White/Valentine Colors
   ═══════════════════════════════════════ */
      .flowers {
        position: relative;
        transform: scale(0.72);
        transform-origin: bottom center;
      }

      .flower {
        position: absolute;
        bottom: 10vmin;
        transform-origin: bottom center;
        z-index: 10;
      }

      /* ─── Flower positions & sway ─── */
      .flower--1 {
        animation: moving-flower-1 4s linear infinite;
      }
      .flower--1 .flower__line {
        height: 70vmin;
        animation-delay: 0.3s;
      }
      .flower--1 .flower__line__leaf--1 {
        animation: blooming-leaf-right 0.8s 1.6s backwards;
      }
      .flower--1 .flower__line__leaf--2 {
        animation: blooming-leaf-right 0.8s 1.4s backwards;
      }
      .flower--1 .flower__line__leaf--3 {
        animation: blooming-leaf-left 0.8s 1.2s backwards;
      }
      .flower--1 .flower__line__leaf--4 {
        animation: blooming-leaf-left 0.8s 1s backwards;
      }
      .flower--1 .flower__line__leaf--5 {
        animation: blooming-leaf-right 0.8s 1.8s backwards;
      }
      .flower--1 .flower__line__leaf--6 {
        animation: blooming-leaf-left 0.8s 2s backwards;
      }

      .flower--2 {
        left: 50%;
        transform: rotate(20deg);
        animation: moving-flower-2 4s linear infinite;
      }
      .flower--2 .flower__line {
        height: 60vmin;
        animation-delay: 0.6s;
      }
      .flower--2 .flower__line__leaf--1 {
        animation: blooming-leaf-right 0.8s 1.9s backwards;
      }
      .flower--2 .flower__line__leaf--2 {
        animation: blooming-leaf-right 0.8s 1.7s backwards;
      }
      .flower--2 .flower__line__leaf--3 {
        animation: blooming-leaf-left 0.8s 1.5s backwards;
      }
      .flower--2 .flower__line__leaf--4 {
        animation: blooming-leaf-left 0.8s 1.3s backwards;
      }

      .flower--3 {
        left: 50%;
        transform: rotate(-15deg);
        animation: moving-flower-3 4s linear infinite;
      }
      .flower--3 .flower__line {
        animation-delay: 0.9s;
      }
      .flower--3 .flower__line__leaf--1 {
        animation: blooming-leaf-right 0.8s 2.5s backwards;
      }
      .flower--3 .flower__line__leaf--2 {
        animation: blooming-leaf-right 0.8s 2.3s backwards;
      }
      .flower--3 .flower__line__leaf--3 {
        animation: blooming-leaf-left 0.8s 2.1s backwards;
      }
      .flower--3 .flower__line__leaf--4 {
        animation: blooming-leaf-left 0.8s 1.9s backwards;
      }

      /* ─── PETALS (yellow gradient) ─── */
      .flower__leafs {
        position: relative;
        animation: blooming-flower 2s backwards;
      }
      .flower__leafs--1 {
        animation-delay: 1.1s;
      }
      .flower__leafs--2 {
        animation-delay: 1.4s;
      }
      .flower__leafs--3 {
        animation-delay: 1.7s;
      }

      /* Petal glow - soft pink */
      .flower__leafs::after {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-50%, -100%);
        width: 8vmin;
        height: 8vmin;
        background-color: var(--pink-pale);
        filter: blur(10vmin);
      }

      .flower__leaf {
        position: absolute;
        bottom: 0;
        left: 50%;
        width: 8vmin;
        height: 11vmin;
        border-radius: 51% 49% 47% 53% / 44% 45% 55% 69%;
        background-color: var(--yellow);
        background-image: linear-gradient(
          to top,
          var(--yellow-deep),
          var(--yellow)
        );
        transform-origin: bottom center;
        opacity: 0.95;
        box-shadow: inset 0 0 2vmin rgba(255, 255, 255, 0.6);
      }

      .flower__leaf--1 {
        transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg);
      }
      .flower__leaf--2 {
        transform: translate(-50%, -4%) rotateX(40deg);
      }
      .flower__leaf--3 {
        transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg);
      }
      .flower__leaf--4 {
        width: 8vmin;
        height: 8vmin;
        transform-origin: bottom left;
        border-radius: 4vmin 10vmin 4vmin 4vmin;
        transform: translate(0%, 18%) rotateX(70deg) rotate(-43deg);
        background-image: linear-gradient(
          to top,
          var(--yellow-deep),
          var(--white)
        );
        z-index: 1;
        opacity: 0.85;
      }

      /* ─── WHITE CENTER CIRCLE (white outer, yellow core) ─── */
      .flower__white-circle {
        position: absolute;
        left: -3.5vmin;
        top: -3vmin;
        width: 9vmin;
        height: 4vmin;
        border-radius: 50%;
        background-color: var(--white);
        box-shadow: 0 0 18px rgba(255, 255, 255, 0.7);
      }

      .flower__white-circle::after {
        content: "";
        position: absolute;
        left: 50%;
        top: 45%;
        transform: translate(-50%, -50%);
        width: 60%;
        height: 60%;
        border-radius: inherit;
        background-image: linear-gradient(
          90deg,
          var(--yellow),
          var(--yellow-deep)
        );
      }

      /* ─── STEM (rose/dusty rose gradient) ─── */
      .flower__line {
        height: 55vmin;
        width: 1.5vmin;
        background-image:
          linear-gradient(
            to left,
            rgba(0, 0, 0, 0.2),
            transparent,
            rgba(255, 255, 255, 0.15)
          ),
          linear-gradient(
            to top,
            transparent 10%,
            var(--wine),
            var(--rose-dusty)
          );
        animation: grow-flower-tree 4s backwards;
      }

      /* ─── STEM LEAVES (rose tones) ─── */
      .flower__line__leaf {
        --w: 7vmin;
        --h: calc(var(--w) + 2vmin);
        position: absolute;
        top: 20%;
        left: 90%;
        width: var(--w);
        height: var(--h);
        border-top-right-radius: var(--h);
        border-bottom-left-radius: var(--h);
        background-image: linear-gradient(
          to top,
          rgba(139, 26, 74, 0.4),
          var(--rose-dusty)
        );
      }

      .flower__line__leaf--1 {
        transform: rotate(70deg) rotateY(30deg);
      }
      .flower__line__leaf--2 {
        top: 45%;
        transform: rotate(70deg) rotateY(30deg);
      }
      .flower__line__leaf--3,
      .flower__line__leaf--4,
      .flower__line__leaf--6 {
        border-top-right-radius: 0;
        border-bottom-left-radius: 0;
        border-top-left-radius: var(--h);
        border-bottom-right-radius: var(--h);
        left: -460%;
        top: 12%;
        transform: rotate(-70deg) rotateY(30deg);
      }
      .flower__line__leaf--4 {
        top: 40%;
      }
      .flower__line__leaf--5 {
        top: 0;
        transform-origin: left;
        transform: rotate(70deg) rotateY(30deg) scale(0.6);
      }
      .flower__line__leaf--6 {
        top: -2%;
        left: -450%;
        transform-origin: right;
        transform: rotate(-70deg) rotateY(30deg) scale(0.6);
      }

      /* ─── LIGHT PARTICLES (yellow + pink) ─── */
      .flower__light {
        position: absolute;
        bottom: 0;
        width: 1vmin;
        height: 1vmin;
        background-color: var(--yellow);
        border-radius: 50%;
        filter: blur(0.25vmin);
        animation: light-ans 4s linear infinite backwards;
      }

      .flower__light:nth-child(odd) {
        background-color: var(--pink-light);
      }
      .flower__light--1 {
        left: -2vmin;
        animation-delay: 1s;
      }
      .flower__light--2 {
        left: 3vmin;
        animation-delay: 0.5s;
      }
      .flower__light--3 {
        left: -6vmin;
        animation-delay: 0.3s;
      }
      .flower__light--4 {
        left: 6vmin;
        animation-delay: 0.9s;
      }
      .flower__light--5 {
        left: -1vmin;
        animation-delay: 1.5s;
      }
      .flower__light--6 {
        left: -4vmin;
        animation-delay: 3s;
      }
      .flower__light--7 {
        left: 3vmin;
        animation-delay: 2s;
      }
      .flower__light--8 {
        left: -6vmin;
        animation-delay: 3.5s;
      }

      /* ─── ADDITIONAL GREENERY ─── */
      .grow-ans {
        animation: grow-ans 2s var(--d) backwards;
      }

      /* Tall curling plant (wine) */
      .flower__g-long {
        --w: 2vmin;
        --h: 6vmin;
        --c: var(--wine);
        position: absolute;
        bottom: 10vmin;
        left: -3vmin;
        transform-origin: bottom center;
        transform: rotate(-30deg) rotateY(-20deg);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        animation: flower-g-long-ans 3s linear infinite;
      }

      .flower__g-long__top {
        width: calc(var(--w) + 1vmin);
        height: var(--h);
        border-top-right-radius: 100%;
        border-right: 0.7vmin solid var(--c);
        transform: translate(-0.7vmin, 1vmin);
      }

      .flower__g-long__bottom {
        width: var(--w);
        height: 50vmin;
        transform-origin: bottom center;
        background-image: linear-gradient(to top, transparent 30%, var(--c));
        clip-path: polygon(35% 0, 65% 1%, 100% 100%, 0% 100%);
      }

      /* Big sweeping leaves (rose) */
      .flower__g-right {
        position: absolute;
        bottom: 6vmin;
        left: -2vmin;
        transform-origin: bottom left;
        transform: rotate(20deg);
      }

      .flower__g-right .leaf {
        width: 30vmin;
        height: 50vmin;
        border-top-left-radius: 100%;
        border-left: 2vmin solid var(--rose);
        -webkit-mask-image: linear-gradient(
          to top,
          transparent 30%,
          var(--rose) 60%
        );
      }

      .flower__g-right--1 {
        animation: flower-g-right-ans 2.5s linear infinite;
      }
      .flower__g-right--2 {
        left: 5vmin;
        transform: rotateY(-180deg);
        animation: flower-g-right-ans--2 3s linear infinite;
      }
      .flower__g-right--2 .leaf {
        height: 75vmin;
        filter: blur(0.3vmin);
        opacity: 0.8;
      }

      /* Front fern (wine/rose) */
      .flower__g-front {
        position: absolute;
        bottom: 6vmin;
        left: 2.5vmin;
        z-index: 100;
        transform-origin: bottom center;
        transform: rotate(-28deg) rotateY(30deg) scale(1.04);
        animation: flower__g-front-ans 2s linear infinite;
      }

      .flower__g-front__line {
        width: 0.3vmin;
        height: 20vmin;
        background-image: linear-gradient(
          to top,
          transparent,
          var(--rose),
          transparent 100%
        );
        position: relative;
      }

      .flower__g-front__leaf-wrapper {
        position: absolute;
        top: 0;
        left: 0;
        transform-origin: bottom left;
        transform: rotate(10deg);
      }

      .flower__g-front__leaf-wrapper:nth-child(even) {
        left: 0;
        transform: rotateY(-180deg) rotate(5deg);
        animation: flower__g-front__leaf-left-ans 1s ease-in backwards;
      }
      .flower__g-front__leaf-wrapper:nth-child(odd) {
        animation: flower__g-front__leaf-ans 1s ease-in backwards;
      }

      .flower__g-front__leaf-wrapper--1 {
        top: -8vmin;
        transform: scale(0.7);
        animation: flower__g-front__leaf-ans 1s 5.5s ease-in backwards !important;
      }
      .flower__g-front__leaf-wrapper--2 {
        top: -8vmin;
        transform: rotateY(-180deg) scale(0.7) !important;
        animation: flower__g-front__leaf-left-ans-2 1s 4.6s ease-in backwards !important;
      }
      .flower__g-front__leaf-wrapper--3 {
        top: -3vmin;
        animation: flower__g-front__leaf-ans 1s 4.6s ease-in backwards;
      }
      .flower__g-front__leaf-wrapper--4 {
        top: -3vmin;
        transform: rotateY(-180deg) scale(0.9) !important;
        animation: flower__g-front__leaf-left-ans-2 1s 4.6s ease-in backwards !important;
      }
      .flower__g-front__leaf-wrapper--5,
      .flower__g-front__leaf-wrapper--6 {
        top: 2vmin;
      }
      .flower__g-front__leaf-wrapper--7,
      .flower__g-front__leaf-wrapper--8 {
        top: 6.5vmin;
      }
      .flower__g-front__leaf-wrapper--2 {
        animation-delay: 5.2s !important;
      }
      .flower__g-front__leaf-wrapper--3 {
        animation-delay: 4.9s !important;
      }
      .flower__g-front__leaf-wrapper--5 {
        animation-delay: 4.3s !important;
      }
      .flower__g-front__leaf-wrapper--6 {
        animation-delay: 4.1s !important;
      }
      .flower__g-front__leaf-wrapper--7 {
        animation-delay: 3.8s !important;
      }
      .flower__g-front__leaf-wrapper--8 {
        animation-delay: 3.5s !important;
      }

      .flower__g-front__leaf {
        width: 10vmin;
        height: 10vmin;
        border-radius: 100% 0% 0% 100% / 100% 100% 0% 0%;
        box-shadow: inset 0 2px 1vmin hsla(330, 80%, 50%, 0.2);
        background-image: \linear-gradient(
          to bottom right,
          var(--wine) 50%,
          transparent 50%,
          transparent
        );
        -webkit-mask-image: linear-gradient(
          to bottom right,
          var(--wine) 50%,
          transparent 50%,
          transparent
        );
        mask-image: linear-gradient(
          to bottom right,
          var(--wine) 50%,
          transparent 50%,
          transparent
        );
      }

      /* Front sprawling vine (rose/burgundy) */
      .flower__g-fr {
        position: absolute;
        bottom: -4vmin;
        left: 0;
        transform-origin: bottom left;
        z-index: 10;
        animation: flower__g-fr-ans 2s linear infinite;
      }

      .flower__g-fr .leaf {
        width: 30vmin;
        height: 50vmin;
        border-top-left-radius: 100%;
        border-left: 2vmin solid var(--rose);
        -webkit-mask-image: linear-gradient(
          to top,
          transparent 25%,
          var(--rose) 50%
        );
        position: relative;
        z-index: 1;
      }

      .flower__g-fr__leaf {
        position: absolute;
        top: 0;
        left: 0;
        width: 10vmin;
        height: 10vmin;
        border-radius: 100% 0% 0% 100% / 100% 100% 0% 0%;
        box-shadow: inset 0 2px 1vmin hsla(330, 80%, 50%, 0.2);
        background-image: linear-gradient(
          to bottom right,
          var(--pink-pale) 45%,
          transparent 50%,
          transparent
        );
        -webkit-mask-image: linear-gradient(
          135deg,
          var(--wine) 40%,
          transparent 50%,
          transparent
        );
      }

      .flower__g-fr__leaf--1 {
        left: 20vmin;
        transform: rotate(45deg);
        animation: flower__g-fr-leaft-ans-1 0.5s 5.2s linear backwards;
      }
      .flower__g-fr__leaf--2 {
        left: 12vmin;
        top: -7vmin;
        transform: rotate(25deg) rotateY(-180deg);
        animation: flower__g-fr-leaft-ans-6 0.5s 5s linear backwards;
      }
      .flower__g-fr__leaf--3 {
        left: 15vmin;
        top: 6vmin;
        transform: rotate(55deg);

   KEYFRAMES
   ═══════════════════════════════════════ */

      /* Flower sway */

        0%,
        100% {
          transform: rotate(2deg);
        }
        50% {
          transform: rotate(-2deg);
        }

      @keyframes moving-flower-2 {
        0%,
        100% {
          transform: rotate(18deg);
        }
        50% {
          transform: rotate(14deg);
        }
      }
      @keyframes moving-flower-3 {
        0%,
        100% {
          transform: rotate(-18deg);
        }
        50% {
          transform: rotate(-20deg) rotateY(-10deg);
        }

      /* Stem leaves bloom in */

        0% {
          transform-origin: left;
          transform: rotate(70deg) rotateY(30deg) scale(0);
        }
      }
      @keyframes blooming-leaf-left {
        0% {
          transform-origin: right;
          transform: rotate(-70deg) rotateY(30deg) scale(0);
        }
      }

      /* Stem grows up */
      @keyframes grow-flower-tree {
        0% {
          height: 0;
          border-radius: 1vmin;
        }
      }

      /* Petal cluster pops in */
      @keyframes blooming-flower {
        0% {
          transform: scale(0);
        }
      }

      /* Light particles float up */
      @keyframes light-ans {
        0% {
          opacity: 0;
          transform: translateY(0);
        }
        25% {
          opacity: 1;
          transform: translateY(-5vmin) translateX(-2vmin);
        }
        50% {
          opacity: 1;
          transform: translateY(-15vmin) translateX(2vmin);
          filter: blur(0.2vmin);
        }
        75% {
          transform: translateY(-20vmin) translateX(-2vmin);
          filter: blur(0.2vmin);
        }
        100% {
          transform: translateY(-30vmin);
          opacity: 0;
          filter: blur(1vmin);
        }
      }

      /* Generic grow */
      @keyframes grow-ans {
        0% {
          transform: scale(0);
          opacity: 0;
        }
      }

      /* Tall curling plant sway */
      @keyframes flower-g-long-ans {
        0%,
        100% {
          transform: rotate(-30deg) rotateY(-20deg);
        }
        50% {
          transform: rotate(-32deg) rotateY(-20deg);
        }
      }

      /* Big sweeping leaves */

        0%,
        100% {
          transform: rotate(20deg);
        }
        50% {
          transform: rotate(24deg) rotateX(-20deg);
        }

          transform: rotateY(-180deg) rotate(0deg) rotateX(-20deg);
        }
        50% {
          transform: rotateY(-180deg) rotate(6deg) rotateX(-20deg);

        }
        50% {

    <script>
      // ═══════════════════════════════════════
      //  VALENTINE'S DAY INTERACTIVE LOGIC
      // ═══════════════════════════════════════

      let noPressCount = 0;
      const YES_BTN = document.getElementById("yes-btn");
      const NO_BTN = document.getElementById("no-btn");

      // Yes button growth stages
      const YES_SIZES = [
        { fontSize: "1rem", padding: "8px 16px" },
        { fontSize: "1.5rem", padding: "12px 24px" },
        { fontSize: "2.2rem", padding: "16px 32px" },
        { fontSize: "3rem", padding: "20px 40px" },
      ];

      function applyYesSize(idx) {
        const size = YES_SIZES[Math.min(idx, YES_SIZES.length - 1)];
        YES_BTN.style.fontSize = size.fontSize;
        YES_BTN.style.padding = size.padding;
      }

      // No button dodge (after 3 presses)
      function dodgeNo(e) {
        const rect = NO_BTN.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height / 2;

        const angle = Math.atan2(cy - e.clientY, cx - e.clientX);
        const spread = 130 + Math.random() * 90;

        let newX = rect.left + Math.cos(angle) * spread;
        let newY = rect.top + Math.sin(angle) * spread;

        const vw = window.innerWidth;
        const vh = window.innerHeight;
        if (newX < 10) newX = 20 + Math.random() * 100;
        if (newX > vw - rect.width - 10)
          newX = vw - rect.width - 20 - Math.random() * 100;
        if (newY < 10) newY = 20 + Math.random() * 100;
        if (newY > vh - rect.height - 10)
          newY = vh - rect.height - 20 - Math.random() * 100;

        NO_BTN.style.position = "fixed";
        NO_BTN.style.left = newX + "px";
        NO_BTN.style.top = newY + "px";
        NO_BTN.style.margin = "0";
      }

      NO_BTN.addEventListener("mouseenter", (e) => {
        if (noPressCount >= 3) dodgeNo(e);
      });
      NO_BTN.addEventListener("mousemove", (e) => {
        if (noPressCount >= 3) dodgeNo(e);
      });

      function handleNo() {
        noPressCount++;
        applyYesSize(noPressCount);
      }

      function handleYes() {
        document.getElementById("ask-page").classList.add("hidden");

        const yesPage = document.getElementById("yes-page");
        setTimeout(() => {
          yesPage.classList.remove("not-loaded");
          yesPage.classList.add("visible");
          spawnHearts();
        }, 600);
      }

      function spawnHearts() {
        const emojis = ["💕", "💗", "💖", "💝", "❤️", "💓", "🌹", "🌼"];
        for (let i = 0; i < 24; i++) {
          setTimeout(() => {
            const heart = document.createElement("div");
            heart.className = "heart";
            heart.textContent =
              emojis[Math.floor(Math.random() * emojis.length)];
            heart.style.left = Math.random() * 90 + "vw";
            heart.style.bottom = "-5vh";
            heart.style.fontSize = 1 + Math.random() * 1.8 + "rem";
            heart.style.animationDuration = 5 + Math.random() * 4 + "s";
            document.getElementById("yes-page").appendChild(heart);
            heart.addEventListener("animationend", () => heart.remove());
          }, i * 320);
        }
      }

      onload = () => {
        const c = setTimeout(() => {
          clearTimeout(c);
        }, 1000);
      };
    </script>
